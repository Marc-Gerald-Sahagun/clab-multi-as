all:
  vars:
    # The generated inventory is assumed to be used from the clab host.
    # Hence no http proxy should be used. Therefore we make sure the http
    # module does not attempt using any global http proxy.
    ansible_httpapi_use_proxy: false
  children:
    arista_ceos:
      vars:
        # ansible_connection: set ansible_connection variable if required
        ansible_user: admin
        ansible_password: admin
      hosts:
        clab-full01-asbr1-1:
          ansible_host: 172.30.30.101
        clab-full01-asbr2-1:
          ansible_host: 172.30.30.110
        clab-full01-r1-1:
          ansible_host: 172.30.30.102
        clab-full01-r1-2:
          ansible_host: 172.30.30.103
        clab-full01-r2-1:
          ansible_host: 172.30.30.111
        clab-full01-r2-2:
          ansible_host: 172.30.30.112
        clab-full01-sw1-1:
          ansible_host: 172.30.30.104
        clab-full01-sw1-2:
          ansible_host: 172.30.30.105
        clab-full01-sw1-3:
          ansible_host: 172.30.30.106
        clab-full01-sw2-1:
          ansible_host: 172.30.30.113
        clab-full01-sw2-2:
          ansible_host: 172.30.30.114
        clab-full01-sw2-3:
          ansible_host: 172.30.30.115
    linux:
      hosts:
        clab-full01-host1-1:
          ansible_host: 172.30.30.107
        clab-full01-host1-2:
          ansible_host: 172.30.30.108
        clab-full01-host1-3:
          ansible_host: 172.30.30.109
        clab-full01-host2-1:
          ansible_host: 172.30.30.116
        clab-full01-host2-2:
          ansible_host: 172.30.30.117
        clab-full01-host2-3:
          ansible_host: 172.30.30.118
