all:
  children:
    network:
      vars:
        ansible_user: admin
        ansible_password: admin
        ansible_network_os: arista.eos.eos
        ansible_connection: ansible.netcommon.network_cli
        ansible_ssh_pass: admin
        ansible_ssh_common_args: '-o PreferredAuthentications=password -o PubkeyAuthentication=no'
        ansible_network_cli_ssh_type: paramiko
        ansible_become: yes
        ansible_become_method: enable
        ansible_become_password: admin
      children:
        interior:
          hosts:
            r1-1:
              ansible_host: 172.30.30.102
            r1-2:
              ansible_host: 172.30.30.103
            r2-1:
              ansible_host: 172.30.30.111
            r2-2:
              ansible_host: 172.30.30.112              
        border:
          hosts:
            asbr1-1:
              ansible_host: 172.30.30.101
            asbr2-1:
              ansible_host: 172.30.30.110
        access:
          hosts:
            sw1-1:
              ansible_host: 172.30.30.104
            sw1-2:
              ansible_host: 172.30.30.105
            sw1-3:
              ansible_host: 172.30.30.106
            sw2-1:
              ansible_host: 172.30.30.113
            sw2-2:
              ansible_host: 172.30.30.114
            sw2-3:
              ansible_host: 172.30.30.115
